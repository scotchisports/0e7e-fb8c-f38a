  const t=String(type).toLowerCase().trim();
  if(/trebles?/.test(t)) return 3;
  if(/doubles?/.test(t)) return 2;
  if(/singles?/.test(t)) return 1;
  const m=t.match(/(\d+)\s*-?\s*folds?/);
  if(m) return Number(m[1]);
  const n=parseInt(t,10);
  return Number.isFinite(n)?n:0;
}

html,body{width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at top,#121a2a 0%,var(--bg) 70%);color:var(--txt);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%;width:100%;gap:0;min-height:0;overflow:hidden;position:relative}
header{display:flex;align-items:center;gap:.6vw;padding:4px 10px;border-bottom:2px solid var(--line);min-height:0;height:40px}
header h1{font-size:clamp(15px,2.4vh,28px);letter-spacing:.12em;font-weight:900;
  background:linear-gradient(90deg,var(--gold),#fff2b8);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.vs-pill{display:flex;align-items:center;gap:.4em;font-size:clamp(11px,1.5vh,16px);font-weight:900;letter-spacing:.08em;white-space:nowrap}
.vs-pill .p-stu{color:var(--stu)} .vs-pill .p-bruce{color:var(--bruce)} .vs-pill .p-vs{color:var(--dim);font-weight:700}
.counts{display:flex;gap:.35vw;font-size:clamp(12px,1.8vh,20px);font-weight:800;white-space:nowrap}
.counts span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.05em .4em}
.legend{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:1;min-width:0}
.legend .lg{display:inline-flex;align-items:center;gap:4px}
.sw{width:11px;height:11px;border-radius:3px;border:2px solid #000;flex:0 0 11px}
.sw.both-win{background:#15803d;border-color:#4ade80}
.sw.both-lose{background:#b91c1c;border-color:#f87171}
.sw.stu-up{background:linear-gradient(90deg,#15803d 50%,#b91c1c 50%);border-color:#ffc83d}
.sw.bruce-up{background:linear-gradient(90deg,#b91c1c 50%,#0f766e 50%);border-color:#3ad0d4}
.sw.pending{background:#2a2e36;border-color:#727986}
.hint{font-size:11px;color:var(--dim);font-weight:700;white-space:nowrap}
.spacer{flex:1;min-width:4px}
.upd{font-size:clamp(10px,1.3vh,13px);color:var(--dim);display:flex;align-items:center;gap:.35em;white-space:nowrap;flex-shrink:0}
.dot{width:.75em;height:.75em;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
.dot.bad{background:var(--red);box-shadow:0 0 10px var(--red);animation:none}
@keyframes pulse{50%{opacity:.35}}
#fsbtn,#sndbtn{font-size:12px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:.2em .55em;cursor:pointer;white-space:nowrap}
#sndbtn.on{border-color:var(--green);color:#bff5d3}
#sndbtn.off{border-color:var(--red);color:#ffb3b8}
#banner{display:none;background:#5a0d12;color:#ffd6d9;border:1px solid var(--red);border-radius:8px;padding:.15em .55em;font-size:12px;white-space:nowrap}


/* ===== LAYOUT 3 SPOTLIGHT BOARD ===== */
.board{
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
  gap:6px;
  padding:6px 10px 4px;
  min-height:0;
  overflow:hidden;
  align-items:stretch;
}
.board.no-live{grid-template-rows:auto minmax(0,1fr)}
.live-grid{
  display:grid;
  gap:8px;
  min-height:0;
  overflow:hidden;
  align-content:stretch;
}
.live-grid.n0{display:none}
.live-grid.n1{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
.live-grid.n2{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr)}
.live-grid.n3,.live-grid.n4{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.live-grid.n5,.live-grid.n6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.live-grid.n7,.live-grid.n8{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr)}

.livecard{
  display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;overflow:hidden;
  background:#0c1f16;border:2px solid #4ade80;border-radius:10px;
  padding:8px 10px 8px;
}
.livecard.both_win,.livecard.stu_only_win{background:#0c1f16;border-color:#4ade80}
.livecard.both_lose,.livecard.stu_only_lose,.livecard.bruce_only_lose{background:#1f0c10;border-color:#f87171}
.livecard.stu_up{background:#1a1c12;border-color:#ffc83d}
.livecard.bruce_up,.livecard.bruce_only_win{background:#0c1f1c;border-color:#2dd4bf}
.livecard.redzone{box-shadow:inset 0 0 0 2px #ff3b4780}
.lc-top{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0}
.live-tag{font-size:10px;font-weight:900;letter-spacing:.12em;color:#4ade80;border:1px solid #4ade80;border-radius:4px;padding:1px 6px;white-space:nowrap}
.lc-top .clock{font-size:15px;font-weight:900;color:var(--amber);letter-spacing:.02em;white-space:nowrap}
.lc-top .dd{font-size:11px;font-weight:700;color:#cfd6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lc-scores{display:flex;align-items:center;justify-content:center;gap:14px;min-height:0;flex:1 1 auto}
.lc-team{display:flex;align-items:center;gap:8px;min-width:0}
.lc-team .id{display:flex;flex-direction:column;line-height:1}
.lc-team.home .id{align-items:flex-end}
.lc-team .ab{font-size:16px;font-weight:900;letter-spacing:.06em}
.lc-team .ab.mine{color:var(--stu)}
.lc-team .pts{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.lc-scores .at{font-size:16px;color:var(--dim);font-weight:800}
.lc-team img,.lc-team .lcirc{height:48px;width:auto;max-width:58px;object-fit:contain;flex-shrink:0}
.lcirc{display:inline-flex;align-items:center;justify-content:center;height:28px;width:28px;aspect-ratio:1;border-radius:50%;font-weight:900;font-size:9px;color:#fff;border:2px solid rgba(255,255,255,.5)}
.ou-chip{display:inline-block;font-weight:900;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:.05em .4em;line-height:1.25}

.livecard .fieldpos{flex:0 0 auto;min-width:0;padding:0}
.livecard .fieldlabel{font-size:10px;line-height:1.2;color:#d7ffe6;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livecard .fieldtrack{height:22px;position:relative;border:1px solid #ffffff55;border-radius:3px;overflow:hidden}
.fieldball{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:14px;line-height:1;filter:drop-shadow(0 0 4px #ffae00)}
.endzone{position:absolute;width:6%;height:100%;background:#ffffff22;font-size:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;letter-spacing:.04em}

.lc-covers{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0;min-height:0}
.pickbox{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:4px 8px;min-width:0;min-height:0;
}
.pickbox.stu{border-color:#3a2e10}
.pickbox.bruce{border-color:#12383a}
.pickbox .pick-main{display:flex;flex-direction:row;align-items:baseline;gap:5px;min-width:0;flex-wrap:wrap}
.pickbox .pick-name{font-size:14px;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbox.stu .pick-name{color:var(--stu)}
.pickbox.bruce .pick-name{color:var(--bruce)}
.pickbox .pick-odds{font-size:11px;color:var(--dim);font-weight:700;white-space:nowrap}
.pickbox .cover-lab{font-size:11px;font-weight:800;white-space:nowrap}
.pickbox.win .cover-lab{color:#4ade80}
.pickbox.lose .cover-lab{color:#f87171}
.pickbox.level .cover-lab{color:#cfd6e4}
.pickbox .mark{font-size:15px;line-height:1;flex:0 0 auto}
.pickbox.empty, .pickbox.nobet{justify-content:center;border-style:dashed;background:transparent;opacity:.85}
.pickbox.nobet .pick-name, .pickbox.empty .pick-name{color:var(--dim);font-size:11px;letter-spacing:.08em}
.pickbox.win{background:#0f2a1a;border-color:#2f7a48}
.pickbox.lose{background:#2a1014;border-color:#8a2a33}
.pickbox.level{background:#1a1d24;border-color:#656a73}

.live-grid.n1 .lc-team .pts{font-size:72px}
.live-grid.n1 .lc-team img,.live-grid.n1 .lc-team .lcirc{height:72px;max-width:88px}
.live-grid.n1 .lc-top .clock{font-size:22px}
.live-grid.n1 .livecard .fieldtrack{height:56px}
.live-grid.n1 .livecard .fieldlabel{font-size:13px}
.live-grid.n1 .pickbox .pick-name{font-size:20px}
.live-grid.n1 .pickbox{padding:8px 12px}
.live-grid.n2 .lc-team .pts{font-size:56px}
.live-grid.n2 .livecard .fieldtrack{height:40px}
.live-grid.n3 .lc-team .pts,.live-grid.n4 .lc-team .pts{font-size:40px}
.live-grid.n3 .lc-team img,.live-grid.n4 .lc-team img,
.live-grid.n3 .lc-team .lcirc,.live-grid.n4 .lc-team .lcirc{height:40px;max-width:50px}
.live-grid.n3 .livecard .fieldtrack,.live-grid.n4 .livecard .fieldtrack{height:28px}
.live-grid.n5 .lc-team .pts,.live-grid.n6 .lc-team .pts{font-size:32px}
.live-grid.n5 .lc-team img,.live-grid.n6 .lc-team img,
.live-grid.n5 .lc-team .lcirc,.live-grid.n6 .lc-team .lcirc{height:32px;max-width:40px}
.live-grid.n5 .livecard .fieldtrack,.live-grid.n6 .livecard .fieldtrack{height:18px}
.live-grid.n5 .lc-top .clock,.live-grid.n6 .lc-top .clock{font-size:13px}
.live-grid.n5 .pickbox .pick-name,.live-grid.n6 .pickbox .pick-name{font-size:12px}
.live-grid.n7 .lc-team .pts,.live-grid.n8 .lc-team .pts{font-size:28px}
.live-grid.n7 .lc-team img,.live-grid.n8 .lc-team img,
.live-grid.n7 .lc-team .lcirc,.live-grid.n8 .lc-team .lcirc{height:28px;max-width:36px}
.live-grid.n7 .lc-team .ab,.live-grid.n8 .lc-team .ab{font-size:13px}
.live-grid.n7 .livecard .fieldtrack,.live-grid.n8 .livecard .fieldtrack{height:16px}
.live-grid.n7 .livecard .fieldlabel,.live-grid.n8 .livecard .fieldlabel{font-size:8px}
.live-grid.n7 .lc-top .clock,.live-grid.n8 .lc-top .clock{font-size:12px}
.live-grid.n7 .pickbox,.live-grid.n8 .pickbox{padding:3px 6px}
.live-grid.n7 .pickbox .pick-name,.live-grid.n8 .pickbox .pick-name{font-size:12px}
.live-grid.n7 .pickbox .cover-lab,.live-grid.n8 .pickbox .cover-lab{font-size:10px}
.live-grid.n7 .livecard,.live-grid.n8 .livecard{padding:6px 7px;gap:4px}

.rail{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px;
  min-height:0;height:168px;flex-shrink:0;overflow:hidden;
}
.live-grid.n1 ~ .rail,.live-grid.n2 ~ .rail{height:188px}
.board.no-live .rail{height:auto;min-height:0;grid-template-rows:auto minmax(0,1fr);grid-template-columns:1fr;align-content:stretch}
.board.no-live .rail-upnext{min-height:0}
.rail-sec{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0;overflow:hidden;
}
.rail-sec h2{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--dim);margin:0;flex-shrink:0}
.rail-list{display:grid;grid-template-columns:1fr;gap:3px;min-height:0;overflow:hidden;flex:1;align-content:start}
.rail-upnext .rail-list{grid-template-columns:1fr 1fr}
.board.no-live .rail-list,.board.no-live .rail-upnext .rail-list{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.chip{
  display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr);
  align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:3px 7px;min-height:24px;min-width:0;overflow:hidden;
}
.chip.both_win,.chip.stu_only_win{background:#0f2a1a;border-color:#4ade80}
.chip.both_lose,.chip.stu_only_lose,.chip.bruce_only_lose{background:#2a1014;border-color:#f87171}
.chip.stu_up{background:#1a1c12;border-color:#ffc83d}
.chip.bruce_up,.chip.bruce_only_win{background:#0c1f1c;border-color:#2dd4bf}
.chip.pending{background:#1c2028;border-color:#3a4150}
.chip.nobet-final{background:#161a22;border-color:#4a5160}
.chip.pending img,.chip.pending .lcirc{filter:grayscale(.7);opacity:.85}
.chip-game{display:flex;align-items:center;gap:4px;min-width:0}
.chip-game img,.chip-game .lcirc{height:18px;width:auto;max-width:22px;object-fit:contain;flex-shrink:0}
.chip-game .ab{font-size:11px;font-weight:800}
.chip-game .pts{font-size:11px;font-weight:800;white-space:nowrap;margin:0 4px;color:var(--txt)}
.chip-game .at{color:var(--dim);font-weight:800;font-size:10px;margin:0 1px}
.chip-game .when{font-size:10px;font-weight:700;color:var(--dim);white-space:nowrap;margin-left:auto;padding-left:4px}
.chip-pick{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip-pick.stu{color:var(--stu)}
.chip-pick.bruce{color:var(--bruce)}
.chip-pick .nob{color:var(--dim);font-size:10px;letter-spacing:.06em}
.rail-empty{color:var(--dim);font-size:11px;font-weight:700;padding:6px 2px}

@keyframes scoreflash{0%{background:#fff7c2}30%{background:#ffc83d}100%{}}
@keyframes flipwin{0%,40%,80%{background:var(--green);transform:scale(1.03)}20%,60%,100%{transform:scale(1)}}
@keyframes fliplose{0%,40%,80%{background:var(--red);transform:scale(1.03)}20%,60%,100%{transform:scale(1)}}
.livecard.flash,.chip.flash{animation:scoreflash 1.6s ease-out 2}
.livecard.flipwin,.chip.flipwin{animation:flipwin 1.2s ease-in-out 3}
.livecard.fliplose,.chip.fliplose{animation:fliplose 1.2s ease-in-out 3}

/* ===== SLIM COLLAPSED ACCA BAR (expanded bodies overlay the board) ===== */
.accas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:3px 8px 5px;
  border-top:2px solid var(--line);
  background:linear-gradient(180deg,#0e1219,#0a0c11);
  align-items:stretch;
  min-height:0;
  z-index:5;
}
.acca-panel{
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:8px;
  padding:0;
  display:flex;flex-direction:column;gap:0;
  min-width:0;
  position:relative;
}
.acca-panel.stu{border-color:#7a5c14;box-shadow:inset 0 0 10px rgba(255,200,61,.08)}
.acca-panel.bruce{border-color:#1a6a6c;box-shadow:inset 0 0 10px rgba(58,208,212,.08)}
.acca-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:5px 10px;text-align:left;font:inherit;min-height:28px;
}
.acca-toggle:focus{outline:2px solid var(--gold);outline-offset:-2px}
.acca-toggle .who{font-size:12px;font-weight:900;letter-spacing:.12em}
.acca-panel.stu .who{color:var(--stu)}
.acca-panel.bruce .who{color:var(--bruce)}
.acca-toggle .sum{font-size:12px;font-weight:700;color:var(--dim);flex:1;text-align:left;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acca-toggle .chev{font-size:11px;color:var(--dim);transition:transform .15s}
.acca-panel.open .chev{transform:rotate(180deg)}
.acca-body{display:none}
.acca-panel.open .acca-body{
  display:flex;flex-direction:column;gap:6px;
  position:absolute;bottom:calc(100% + 4px);left:0;right:0;
  max-height:min(48vh,420px);overflow:auto;
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:10px;
  padding:8px 12px 10px;
  box-shadow:0 -10px 28px rgba(0,0,0,.55);
  z-index:6;
}
.acca-panel.stu.open .acca-body{border-color:#7a5c14}
.acca-panel.bruce.open .acca-body{border-color:#1a6a6c}
.acca-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.acca-top .meta{font-size:12px;color:var(--dim);font-weight:700;margin-top:1px}
.waiting-box{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:72px;border:1px dashed #1a6a6c;border-radius:10px;
  color:var(--bruce);font-weight:800;letter-spacing:.04em;padding:12px;
  background:#0e1a1c;
}
.headline{
  flex:1;max-width:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:10px;padding:8px 12px;border:2px solid;
}
.headline.busted{background:#2a1014;border-color:#f87171}
.headline.alive{background:#0f2a1a;border-color:#4ade80}
.headline .h-name{font-size:16px;font-weight:900;letter-spacing:.08em;line-height:1}
.headline .h-state{font-size:22px;font-weight:900;letter-spacing:.08em;line-height:1}
.headline.busted .h-state{color:#f87171}
.headline.alive .h-state{color:#4ade80}
.headline .h-sub{font-size:11px;font-weight:700;color:#cfd5e2;margin-top:3px}
.headline .h-left{display:flex;flex-direction:column;gap:2px}
.rows-acca{display:flex;flex-direction:column;gap:4px}
.betrow{
  display:grid;
  grid-template-columns:86px minmax(0,1fr) auto auto;
  align-items:center;gap:8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;min-height:40px;
}
.betrow.busted{background:#1a1012;border-color:#5a2428}
.betrow.alive{background:#0e1c14;border-color:#2f7a48}
.betrow .name{font-size:13px;font-weight:800}
.betrow .stake{font-size:11px;color:var(--dim);font-weight:700}
.betrow .lines{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.betrow .lines span{font-size:11px;font-weight:700;color:var(--dim);margin-left:4px}
.betrow .ret{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.betrow.busted .ret{color:#f87171}
.betrow.alive .ret{color:#4ade80}
.betrow .note{font-size:10px;color:var(--dim);font-weight:700}
.pill{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:.06em;padding:3px 7px;border-radius:5px;line-height:1;white-space:nowrap}
.pill.busted{background:#b91c1c;color:#fff}
.pill.alive{background:#15803d;color:#fff}
#empty{display:none}


/* PHONE LAYOUT — live cards, then up next, then results */
@media (max-width: 700px){
  html,body{width:100%;height:100%;height:100dvh;overflow:hidden}
  #app{height:100%;height:100dvh;overflow:hidden;grid-template-rows:auto minmax(0,1fr) auto}
  header{height:auto;min-height:0;flex-wrap:wrap;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-top));gap:6px 8px}
  header h1{font-size:15px;letter-spacing:.08em}
  .vs-pill{font-size:12px}
  .counts{font-size:12px;gap:4px}
  .legend{flex:1 0 100%;flex-wrap:wrap;white-space:normal;font-size:10px;gap:8px;order:5}
  .hint{display:none}
  .upd{font-size:11px}
  #fsbtn,#sndbtn{font-size:11px;padding:.25em .5em}
  .board{
    display:flex;flex-direction:column;
    overflow-x:hidden;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    grid-template-rows:none;
    gap:8px;padding:6px 8px 8px;align-items:stretch;
  }
  .board.no-live{grid-template-rows:none}
  .live-grid,.live-grid.n1,.live-grid.n2,.live-grid.n3,.live-grid.n4,
  .live-grid.n5,.live-grid.n6,.live-grid.n7,.live-grid.n8{
    display:flex;flex-direction:column;flex:0 0 auto;height:auto;
    grid-template-columns:none;grid-template-rows:none;gap:8px;
  }
  .live-grid.n0{display:none}
  .livecard{flex:0 0 auto;height:auto;min-height:200px;padding:10px}
  .live-grid.n1 .lc-team .pts,.live-grid.n2 .lc-team .pts,
  .live-grid.n3 .lc-team .pts,.live-grid.n7 .lc-team .pts,.live-grid.n8 .lc-team .pts{font-size:42px}
  .live-grid.n1 .lc-team img,.live-grid.n1 .lc-team .lcirc,
  .live-grid.n7 .lc-team img,.live-grid.n7 .lc-team .lcirc{height:48px;max-width:58px}
  .live-grid.n1 .livecard .fieldtrack,.live-grid.n7 .livecard .fieldtrack{height:28px}
  .live-grid.n1 .pickbox .pick-name,.live-grid.n7 .pickbox .pick-name{font-size:15px}

<body>
<div id="app">
  <header>
    <h1>🏈 SUNDAY TICKET</h1>
    <div class="vs-pill"><span class="p-stu" id="name-stu">SCOTCHI</span><span class="p-vs">vs</span><span class="p-bruce" id="name-bruce">BOET</span></div>
    <div class="counts"><span id="cW">✅ 0</span><span id="cL">❌ 0</span><span id="cD">➖ 0</span><span id="cP">⏳ 0</span></div>
    <div class="legend" aria-label="Game colours">
      <span class="lg"><span class="sw both-win"></span> Both up</span>
      <span class="lg"><span class="sw both-lose"></span> Both down</span>
      <span class="lg"><span class="sw stu-up"></span> <span id="leg-stu-up">Scotchi up</span></span>
      <span class="lg"><span class="sw bruce-up"></span> <span id="leg-bruce-up">Boet up</span></span>
      <span class="lg"><span class="sw pending"></span> To play</span>
    </div>
    <div id="banner"></div>
    <div class="spacer"></div>
    <div class="upd"><div id="dot" class="dot"></div><span id="upd">Connecting…</span></div>
    <button id="sndbtn" class="off" title="Sound alerts (S)">🔇 Sound off</button>
    <button id="fsbtn" title="Full screen (F)">⛶ Full screen</button>
  </header>
  <div class="board" id="board"></div>
  <div class="accas" id="accas"></div>
</div>
<script>
'use strict';
const UK = 'Europe/London';
const fmtTime = new Intl.DateTimeFormat('en-GB',{timeZone:UK,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtKo = new Intl.DateTimeFormat('en-GB',{timeZone:UK,weekday:'short',hour:'2-digit',minute:'2-digit'});
const fmtKoToday = new Intl.DateTimeFormat('en-GB',{timeZone:UK,hour:'2-digit',minute:'2-digit'});
const etDate = d => new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(d);
const ukDate = d => new Intl.DateTimeFormat('en-CA',{timeZone:UK}).format(d);

let prev = {};          // eventId -> {score:'a-b', status:'win|lose|pre'}
let firstRun = true;
let lastData = null;

function choose(n,k){ if(k<0||k>n) return 0; let r=1; for(let i=1;i<=k;i++){ r=r*(n-k+i)/i; } return Math.round(r); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function mapLeg(l){
  const raw = String(l.line||'').trim();
  const ou = raw.match(/^(O|U|Over|Under)\s*([0-9.]+)$/i);
  if(/^ml$/i.test(raw)) return { team:l.team, opp:l.opp, type:'ml', odds:Number(l.odds) };
  if(ou) return { team:l.team, opp:l.opp, type:'total', side:ou[1][0].toUpperCase()==='O'?'over':'under', line:Number(ou[2]), odds:Number(l.odds) };
  return { team:l.team, opp:l.opp, type:'spread', line:Number(raw), odds:Number(l.odds) };
}
function mapBet(b){
  const stakeUnknown = b.stake_per_line == null && b.total_stake == null && b.stake == null;
  const stakePer = stakeUnknown ? null : Number(b.stake_per_line != null ? b.stake_per_line : (b.stake || 0));
  const lines = Number(b.lines || 0);
  const total = stakeUnknown ? null : Number(b.total_stake != null ? b.total_stake : (stakePer * lines) || 0);
  return {
    name: b.type, type: b.type, folds: foldsOf(b.type), lines,
    stake_per_line: stakePer, total_stake: total,
    potential: b.potential == null ? null : Number(b.potential),
    boost: Number(b.boost || 0),
    stakeUnknown
  };
}
function getPlayers(){
  const p = WEEK.players || {};
  const stuSrc = p.stu || p.Stu;
  const bruceSrc = p.bruce || p.Bruce;
  const stuLegs = (stuSrc && stuSrc.legs && stuSrc.legs.length) ? stuSrc.legs : (WEEK.legs || []);
  const stuBets = (stuSrc && stuSrc.bets && stuSrc.bets.length) ? stuSrc.bets : (WEEK.bets || []);
  return {
    stu: { name: (stuSrc && stuSrc.name) || 'Scotchi', legs: stuLegs.map(mapLeg), bets: stuBets.map(mapBet) },
    bruce: {
      name: (bruceSrc && bruceSrc.name) || 'Boet',
      legs: ((bruceSrc && bruceSrc.legs) || []).map(mapLeg),
      bets: ((bruceSrc && bruceSrc.bets) || []).map(mapBet)
    }
  };
}

function displayName(who){
  const p = getPlayers()[who];
  if(p && p.name) return p.name;
  return who==='stu' ? 'Scotchi' : 'Boet';
}
function possessiveName(who){
  const n = displayName(who);
  return n + (/s$/i.test(n) ? "'" : "'s");
}
function applyDisplayNames(){
  const stu = displayName('stu'), bruce = displayName('bruce');
  const stuEl = document.getElementById('name-stu');
  const bruceEl = document.getElementById('name-bruce');
  if(stuEl) stuEl.textContent = stu.toUpperCase();
  if(bruceEl) bruceEl.textContent = bruce.toUpperCase();
  const stuUp = document.getElementById('leg-stu-up');
  const bruceUp = document.getElementById('leg-bruce-up');
  if(stuUp) stuUp.textContent = stu + ' up';
  if(bruceUp) bruceUp.textContent = bruce + ' up';
}

function gbp(n){
  if(!Number.isFinite(n)) return '—';
  return '£' + n.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function stakeLabel(b){
  if(b.stakeUnknown || (b.stake_per_line == null && b.total_stake == null)){
    return (b.lines>1 ? b.lines+' lines' : '1 line') + ' · stake tbc';
  }
  if(!b.stake_per_line && !b.total_stake) return '';
  const per = b.stake_per_line >= 1
    ? '£' + (Number.isInteger(b.stake_per_line) ? b.stake_per_line : b.stake_per_line.toFixed(2))
    : Math.round(b.stake_per_line * 100) + 'p';
  return b.lines + ' × ' + per;
}
function foldShort(name){ return foldsOf(name) + 'F'; }
function foldTitle(name){
  const n = foldsOf(name);
  return n + ' FOLD' + (String(name).toLowerCase().includes('folds') ? 'S' : '');
}
function combos(arr, k){
  const out = [];
  const n = arr.length;
  if(k<=0 || k>n) return out;
  const idx = Array.from({length:k}, (_,i)=>i);
  while(true){
    out.push(idx.map(i=>arr[i]));
    let i=k-1;
    while(i>=0 && idx[i]===i+n-k) i--;
    if(i<0) break;
    idx[i]++;
    for(let j=i+1;j<k;j++) idx[j]=idx[j-1]+1;
  }
  return out;
}
function sumProducts(odds, n){
  if(n<=0) return 0;
  return combos(odds, n).reduce((s,c)=>s+c.reduce((a,b)=>a*b,1),0);
}
function accaStats(legs, bet){
  const N = legs.length;
  const n = bet.folds;
  const lost = legs.filter(l=>l.status==='lose');
  const won = legs.filter(l=>l.status==='win');
  const L = lost.length, W = won.length;
  const alive = choose(N-L, n);
  const alreadyWon = choose(W, n);
  const busted = L > N-n || alive<=0;
  const total = bet.lines || choose(N, n);
  let rem = 0;
  if(!busted && N && n){
    const allOdds = legs.map(l=>l.odds);
    const liveOdds = legs.filter(l=>l.status!=='lose').map(l=>l.odds);
    const allRaw = sumProducts(allOdds, n);
    const remRaw = sumProducts(liveOdds, n);
    if(bet.stakeUnknown) rem = 0;
    else if(bet.potential && allRaw>0) rem = bet.potential * remRaw / allRaw;
    else rem = remRaw * (bet.stake_per_line || 0);
  }
  return { name:bet.name, short:foldShort(bet.name), title:foldTitle(bet.name), folds:n, total, alive, alreadyWon, busted, rem, stakeLabel:stakeLabel(bet), boost:bet.boost, stakeUnknown:!!bet.stakeUnknown };
}
function hasBets(player){ return !!(player && player.legs && player.legs.length); }
function legForPlayer(g, legs){
  return (legs||[]).find(l => g.teams.some(t=>t.ab===l.team));
}
function h2hClass(stuS, bruceS, hasBruce, pre, final, stuHas){
  if(pre) return 'pending';
  const sw = stuS==='win', sl = stuS==='lose', bw = bruceS==='win', bl = bruceS==='lose';
  let cls = final ? 'final ' : '';
  if(!hasBruce){
    if(stuHas && sw) return cls+'stu_only_win';
    if(stuHas && sl) return cls+'stu_only_lose';
    if(final) return 'final nobet-final';
    return cls;
  }
  if(sw && bw) return cls+'both_win';
  if(sl && bl) return cls+'both_lose';
  if(sw && bl) return cls+'stu_up';
  if(sl && bw) return cls+'bruce_up';
  if(sw) return cls+'stu_only_win';
  if(sl) return cls+'stu_only_lose';
  if(bw) return cls+'bruce_only_win';
  if(bl) return cls+'bruce_only_lose';
  if(final && !stuHas && !bw && !bl) return 'final nobet-final';
  return cls;
}
function clockText(g){
  const pre = g.state==='pre', final = g.state==='post';
  if(pre){ return ukDate(g.date)===ukDate(new Date()) ? `Kick-off ${fmtKoToday.format(g.date)} UK` : `${fmtKo.format(g.date)} UK`; }
  if(final) return 'FINAL';
  if(/HALFTIME/.test(g.name)) return 'Half-time';
  return g.detail || `${g.clock} Q${g.period}`;
}
function clockTextShort(g){
  if(g.state!=='pre') return clockText(g);
  if(ukDate(g.date)===ukDate(new Date())) return fmtKoToday.format(g.date);
  return fmtKo.format(g.date);
}
function pickLabel(leg){
  if(!leg) return '';
  if(leg.type==='total') return `${leg.side==='over'?'O':'U'} ${Number(leg.line)}`;
  if(leg.type==='spread'){ const l=Number(leg.line); return `${leg.team} ${l>0?'+':''}${l}`; }
  return `${leg.team} ML`;
}
function pickLabelHtml(leg){
  const txt = pickLabel(leg);
  if(leg && leg.type==='total') return `<span class="ou-chip">${esc(txt)}</span>`;
  return esc(txt);
}
function isWomensEvent(ev){
  const bits = [ev.name, ev.shortName, ev.shortDetail, ev.league && ev.league.name,
    ev.competitions && ev.competitions[0] && ev.competitions[0].notes && JSON.stringify(ev.competitions[0].notes)].join(' ');
  return /women|wnba|w\.n\.f\.l|wpsl|women'?s/i.test(bits);
}

  accasOpen = !!on;
  const wrap = document.getElementById('accas');
  if(wrap) wrap.classList.toggle('open', accasOpen);
  document.querySelectorAll('.acca-panel').forEach(el=>{
    el.classList.toggle('open', accasOpen);
    const btn = el.querySelector('.acca-toggle');
    if(btn) btn.setAttribute('aria-expanded', accasOpen ? 'true' : 'false');
  });
}
function toggleAccas(){ setAccasOpen(!accasOpen); }

function parseEvent(ev){
  const c = ev.competitions[0];
  const home = c.competitors.find(t=>t.homeAway==='home'), away = c.competitors.find(t=>t.homeAway==='away');
  const st = ev.status.type;
  const sit = c.situation || {};
  return {
    id: ev.id, date: new Date(ev.date), state: st.state, completed: st.completed, detail: st.shortDetail, name: st.name,
    period: ev.status.period, clock: ev.status.displayClock,
    teams: [away, home].map(t=>({ id:t.team.id, ab:t.team.abbreviation, name:t.team.shortDisplayName||t.team.name,
        logo:t.team.logo || (t.team.logos&&t.team.logos[0]&&t.team.logos[0].href) || '', score: Number(t.score||0), color: t.team.color||'' })),
    yardLine: sit.yardLine, down: sit.down, possessionText: sit.possessionText || '', possession: sit.possession, redZone: !!sit.isRedZone, dd: sit.shortDownDistanceText || '',
  };
}

function stampLabel(g,leg,s){
  if(leg.type==='total'){
    const total=g.teams.reduce((n,t)=>n+t.score,0);
    if(total===Number(leg.line) || s==='level') return 'PUSH';
    return s==='win'?'✓ WON':'✗ LOST';
  }
  const me=g.teams.find(t=>t.ab===leg.team),op=g.teams.find(t=>t.ab!==leg.team);
  return leg.type==='spread' && me.score+Number(leg.line||0)===op.score ? 'PUSH' : s==='win'?'✓ WON':'✗ LOST';
}
function fieldHtml(g, tall){
  if(g.state!=='in') return '';
  const ht = /HALFTIME/i.test((g.name||'')+' '+(g.detail||''));
  const hasYl = Number.isFinite(g.yardLine) && g.yardLine>=0 && g.yardLine<=100;
  if(ht || !hasYl){
    return `<div class="fieldpos"><div class="fieldlabel">${esc(ht?'Half-time':(g.dd||clockText(g)))}</div><div class="fieldtrack" style="background:#164c32"><span class="endzone" style="left:0">${esc(g.teams[0].ab)}</span><span class="endzone" style="right:0">${esc(g.teams[1].ab)}</span></div></div>`;
  }
  const side=g.teams.findIndex(t=>String(t.id)===String(g.possession));
  // ESPN measures from HOME's goal line, regardless of possession.
  const yl=100-g.yardLine;
  const own = side===0?yl:(side===1?100-yl:null);
  const rz = g.redZone || (own!=null && own>80);
  let label = '';
  if(g.possessionText){
    label = g.possessionText + (g.dd ? ' · '+g.dd : '');
  } else if(side>=0){
    const spot = own<=50?'OWN '+own:'OPP '+(100-own);
    label = g.teams[side].ab+' '+spot + (g.dd ? ' · '+g.dd : '');
  } else {
    label = g.dd || clockText(g);
  }
  const ticks=Array.from({length:9},(_,i)=>{const y=(i+1)*10;return `<span style="position:absolute;left:${5+y*.9}%;top:0;height:100%;border-left:1px solid #ffffff66;font-size:7px;color:#ddd">${Math.min(y,100-y)}</span>`;}).join('');
  const ball = `<span class="fieldball" style="left:${5+yl*.9}%">🏈</span>`;
  return `<div class="fieldpos"><div class="fieldlabel">${esc(label)}</div><div class="fieldtrack" style="background:${rz?'#702828':'#164c32'}"><span class="endzone" style="left:0">${esc(g.teams[0].ab)}</span><span class="endzone" style="right:0">${esc(g.teams[1].ab)}</span>${ticks}${ball}</div></div>`;
}
function coverText(leg, st){
  if(!leg || st==='pre' || !st) return '';
  if(st==='level') return 'level';
  if(leg.type==='ml') return st==='win' ? 'winning' : 'losing';
  return st==='win' ? 'covering' : 'not covering';
}

function legFor(g){
  return BETS.legs.find(l => g.teams.some(t=>t.ab===l.team));
}
function legStatus(g, leg){
  if(g.state==='pre') return 'pre';
  if(leg.type==='total'){
    const total = g.teams.reduce((s,t)=>s+t.score,0);
    const line = Number(leg.line);
    if(total === line) return 'level';
    const over = total > line;
    return (leg.side==='over' ? over : !over) ? 'win' : 'lose';
  }
  const me = g.teams.find(t=>t.ab===leg.team), op = g.teams.find(t=>t.ab!==leg.team);
  const adj = me.score + (leg.type==='spread' ? Number(leg.line||0) : 0);
  if(adj > op.score) return 'win';
  if(adj === op.score && g.state!=='post') return 'level';   // live level score = neutral; a FINAL tie counts as lost
  if(adj === op.score && leg.type==='spread') return 'level';
  return 'lose';
}
function pickText(leg){
  if(leg.type==='total') return `${leg.side==='over'?'Over':'Under'} ${Number(leg.line)}`;
  if(leg.type==='spread'){ const l=Number(leg.line); return `${leg.team} ${l>0?'+':''}${l}`; }
  return `${leg.team} to win`;
}
function emojiFor(s){ return s==='win'?'✅':s==='lose'?'❌':s==='level'?'➖':'⏳'; }

function selectGames(events){
  const games = events.filter(ev=>!isWomensEvent(ev)).map(parseEvent);
  if(SHOW_ALL) return games.sort((a,b)=> a.date-b.date || a.teams[1].ab.localeCompare(b.teams[1].ab));
  const now = new Date();
  // "today's slate" = games on today's US Eastern date (so a 01:20 UK Monday kick-off still counts as Sunday)
  let today = etDate(now);
  let sel = games.filter(g=>etDate(g.date)===today);
  if(!sel.length){ // nothing today: show the next game day in the week, else whole week
    const fut = games.filter(g=>g.date>=new Date(now-6*3600e3)).sort((a,b)=>a.date-b.date);
    if(fut.length){ today = etDate(fut[0].date); sel = games.filter(g=>etDate(g.date)===today); } else sel = games.slice();
  }
  for(const g of games){
    if(sel.includes(g)) continue;
    if(legFor(g) || g.teams.some(t=>ALWAYS_SHOW.includes(t.ab))) sel.push(g);
  }
  sel.sort((a,b)=> a.date-b.date || a.teams[1].ab.localeCompare(b.teams[1].ab));
  return sel;
}

function gameKey(g){
  return g.teams[0].ab + '@' + g.teams[1].ab;
}
function reviveGameDates(){
  for(const g of GAMES){ if(!(g.date instanceof Date)) g.date = new Date(g.date); }
}
function mergeLive(events){
  const fresh = (events||[]).filter(ev=>!isWomensEvent(ev)).map(parseEvent);
  const byKey = new Map(fresh.map(g=>[gameKey(g), g]));
  const byId = new Map(fresh.map(g=>[String(g.id), g]));
  for(let i=0;i<GAMES.length;i++){
    const nxt = byKey.get(gameKey(GAMES[i])) || byId.get(String(GAMES[i].id));
    if(nxt) GAMES[i] = nxt;
  }
}
function demoCount(){
  const n = Number(new URLSearchParams(location.search).get('demo')||0);
  return (n===1||n===3||n===7) ? n : 0;
}
function applyDemo(){
  const n = demoCount();
  if(!n) return;
  const early = ['KC@ATL','HOU@CLE','MIN@GB','MIA@IND','CAR@NO','BUF@NYJ','JAX@TEN'];
  const fake = {
    'DET@NE?': null,
    'NE@DET': {score:[10,21], clock:'7:42', period:3, detail:'7:42 - 3rd', dd:'2nd & 6', yard:42, poss:'home', red:false},
    'KC@ATL': {score:[17,10], clock:'8:22', period:2, detail:'8:22 - 2nd', dd:'1st & 10', yard:68, poss:'away', red:false},
    'HOU@CLE': {score:[13,16], clock:'4:10', period:3, detail:'4:10 - 3rd', dd:'3rd & 4', yard:22, poss:'home', red:true},
    'MIN@GB': {score:[14,17], clock:'11:03', period:2, detail:'11:03 - 2nd', dd:'2nd & 7', yard:45, poss:'home', red:false},
    'MIA@IND': {score:[10,17], clock:'2:40', period:1, detail:'2:40 - 1st', dd:'1st & 10', yard:35, poss:'home', red:false},
    'CAR@NO': {score:[3,21], clock:'9:15', period:3, detail:'9:15 - 3rd', dd:'2nd & 8', yard:80, poss:'home', red:false},
    'BUF@NYJ': {score:[24,7], clock:'0:45', period:2, detail:'0:45 - 2nd', dd:'3rd & 2', yard:25, poss:'away', red:true},
    'JAX@TEN': {score:[20,13], clock:'6:12', period:4, detail:'6:12 - 4th', dd:'1st & 10', yard:55, poss:'away', red:false}
  };
  const want = new Set();
  if(n===1) want.add('NE@DET');
  else if(n===3){ want.add('NE@DET'); want.add('KC@ATL'); want.add('BUF@NYJ'); }
  else { early.forEach(k=>want.add(k)); }

  for(const g of GAMES){
    const key = g.teams[0].ab+'@'+g.teams[1].ab;
    if(want.has(key)){
      const f = fake[key] || {score:[14,17], clock:'5:00', period:2, detail:'5:00 - 2nd', dd:'1st & 10', yard:50, poss:'home', red:false};
      g.state='in'; g.completed=false; g.name='STATUS_IN_PROGRESS';
      g.clock=f.clock; g.period=f.period; g.detail=f.detail; g.dd=f.dd;
      g.yardLine=f.yard; g.redZone=!!f.red;
      g.teams[0].score=f.score[0]; g.teams[1].score=f.score[1];
      const side = f.poss==='away'?0:1;
      g.possession = g.teams[side].id;
      const ylFromPoss = side===1 ? f.yard : (100-f.yard);
      g.possessionText = (ylFromPoss<=50 ? (g.teams[side].ab+' '+ylFromPoss) : (g.teams[1-side].ab+' '+(100-ylFromPoss)));
    } else if(g.state==='in'){
      // In the 7-game early-window demo, finish any leftover live game (e.g. DET).
      if(n===7){
        g.state='post'; g.completed=true; g.name='STATUS_FINAL'; g.detail='Final'; g.clock='0:00'; g.dd=''; g.redZone=false;
      }
    }
  }
}
function loadCachedGames(){
  try{
    const cached = JSON.parse(localStorage.getItem('st_last')||'null');
    if(!cached || !Array.isArray(cached.games) || !cached.games.length) return false;
    const byKey = new Map(cached.games.map(g=>[(g.teams[0].ab+'@'+g.teams[1].ab), g]));
    const byId = new Map(cached.games.map(g=>[String(g.id), g]));
    for(let i=0;i<GAMES.length;i++){
      const nxt = byKey.get(GAMES[i].teams[0].ab+'@'+GAMES[i].teams[1].ab) || byId.get(String(GAMES[i].id));
      if(nxt) GAMES[i] = nxt;
    }
    return true;
  }catch(e){ return false; }
}

  reviveGameDates();
  applyDemo();
  const games = GAMES.slice().sort((a,b)=> a.date-b.date || a.teams[1].ab.localeCompare(b.teams[1].ab));
  const board = document.getElementById('board');
  let w=0,l=0,p=0,d=0;
  const stuStates = new Map();
  const bruceStates = new Map();
  const live=[], results=[], upcoming=[];
  const flashes = [];
  for(const g of games){
    const stuLeg = legForPlayer(g, players.stu.legs);
    const bruceLeg = hasBruce ? legForPlayer(g, players.bruce.legs) : null;
    const sStu = stuLeg ? legStatus(g, stuLeg) : null;
    const sBruce = bruceLeg ? legStatus(g, bruceLeg) : null;
    if(stuLeg){ stuStates.set(stuLeg, sStu); if(sStu==='win') w++; else if(sStu==='lose') l++; else if(sStu==='level') d++; else p++; }
    if(bruceLeg) bruceStates.set(bruceLeg, sBruce);

    const scoreKey = g.teams.map(t=>t.score).join('-');
    const pv = prev[g.id];
    const lastTd = {};
    if(!firstRun && pv){
      const flipped = stuLeg && pv.status!==sStu && pv.status!=='pre' && sStu!=='pre';
      if(flipped && (sStu==='win'||sStu==='lose')) flashes.push([g.id, sStu==='win'?'flipwin':'fliplose']);
      else if(pv.score!==scoreKey || flipped) flashes.push([g.id,'flash']);
      g.teams.forEach((t,i)=>{
        const delta = t.score - pv.scores[i];
        if(delta>0){ const txt = scoreText(delta, t.name, pv.td && pv.td[i]); queueAlert(txt, true, [SCORE_CLIP[txt.split(', ')[0]], 't_'+t.ab]); }
        lastTd[i] = delta>=6 && delta<=8 ? true : (delta>0 ? false : (pv.td && pv.td[i]));
      });
      if(pv.state==='pre' && g.state==='in') queueAlert(`Kick-off ${g.teams[0].name} at ${g.teams[1].name}`, false, [], 'kick');
      if(pv.state!=='post' && g.state==='post') queueAlert(`Game over ${g.teams[0].name} at ${g.teams[1].name}`, false, ['g_over'], 'final');
      if(stuLeg){
        const nm = (g.teams.find(t=>t.ab===stuLeg.team)||{}).name || stuLeg.team;
        if(g.state==='post' && pv.state!=='post'){ const ph = sStu==='win'?'won':'lost'; queueAlert(`${nm} leg ${ph}`, false, ['t_'+stuLeg.team, LEG_CLIP[ph]]); }
        else if(flipped){ const ph = 'now '+(sStu==='win'?'winning':sStu==='lose'?'losing':'level'); queueAlert(`${nm} leg ${ph}`, false, ['t_'+stuLeg.team, LEG_CLIP[ph]]); }
      }
    }
    prev[g.id] = {score:scoreKey, status:sStu, state:g.state, scores:g.teams.map(t=>t.score), td:[lastTd[0],lastTd[1]]};

    const pre = g.state==='pre';
    const final = g.state==='post';
    const rec = {g, stuLeg, sStu, bruceLeg, sBruce};
    if(g.state==='in') live.push(rec);
    else if(final) results.push(rec);
    else upcoming.push(rec);
  }
  for(const leg of players.stu.legs){ if(!stuStates.has(leg)) p++; }

  const nLive = live.length;
  const liveCls = 'n' + Math.min(Math.max(nLive,0), 8);
  board.className = 'board' + (nLive ? '' : ' no-live');
  const liveHtml = live.map(r => renderLiveCard(r.g, r.stuLeg, r.sStu, r.bruceLeg, r.sBruce, hasBruce)).join('');
  const resHtml = results.length
    ? results.map(r => renderChip(r.g, r.stuLeg, r.sStu, r.bruceLeg, r.sBruce, hasBruce, false, true)).join('')
    : '<div class="rail-empty">No results yet</div>';
  const upHtml = upcoming.length
    ? upcoming.map(r => renderChip(r.g, r.stuLeg, r.sStu, r.bruceLeg, r.sBruce, hasBruce, true, false)).join('')
    : '<div class="rail-empty">Nothing scheduled</div>';
  board.innerHTML = `<div class="live-grid ${liveCls}">${liveHtml}</div>
    <div class="rail">
      <section class="rail-sec rail-results"><h2>RESULTS</h2><div class="rail-list">${resHtml}</div></section>
      <section class="rail-sec rail-upnext"><h2>UP NEXT</h2><div class="rail-list">${upHtml}</div></section>
    </div>`;
  for(const [id,cls] of flashes){
    board.querySelectorAll(`[data-id="${id}"]`).forEach(el=>{ void el.offsetWidth; el.classList.add(cls); });
  }
  firstRun = false;

  applyDisplayNames();
  document.getElementById('cW').textContent = `✅ ${w}`;
  document.getElementById('cL').textContent = `❌ ${l}`;
  document.getElementById('cD').textContent = `➖ ${d}`;
  document.getElementById('cP').textContent = `⏳ ${p}`;

  const accas = document.getElementById('accas');
  accas.innerHTML = renderAccaPanel('stu', players.stu, stuStates, false) + renderAccaPanel('bruce', players.bruce, bruceStates, !hasBruce);
  accas.querySelectorAll('.acca-toggle').forEach(btn=>{
    btn.addEventListener('click', ev=>{ ev.preventDefault(); toggleAccas(); });
  });
  setAccasOpen(accasOpen);
}

function setLiveStatus(ok){
  const dot = document.getElementById('dot');
  const upd = document.getElementById('upd');
  const b = document.getElementById('banner');
  if(b) b.style.display='none';
  if(ok){
    dot.className = 'dot';
    upd.textContent = 'live · updated ' + fmtTime.format(new Date()) + ' UK';
  } else {
    dot.className = 'dot bad';
    upd.textContent = 'offline';
  }
}

async function poll(){
  try{
    const src = new URLSearchParams(location.search).get('src') || ESPN_URL; // ?src= only for testing
    const r = await fetch(src + (src.includes('?')?'&':'?') + '_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    lastData = data;
    mergeLive(data.events||[]);
    try{ localStorage.setItem('st_last', JSON.stringify({t:Date.now(), games:GAMES})); }catch(e){}
    render();
    setLiveStatus(true);
  }catch(e){
    console.warn('ESPN fetch failed', e);
    loadCachedGames();
    if(GAMES && GAMES.length) render();
    setLiveStatus(false);
  }
}

/* ===================== SOUND ALERTS ===================== */
function scoreText(delta, name, hadTdLastPoll){
  const L = {6:'Touchdown', 7:'Touchdown and extra point', 8:'Touchdown and two-point conversion',
             3:'Field goal', 1:'Extra point', 9:'Touchdown and field goal', 10:'Touchdown and field goal'};
  let label = L[delta];
  if(delta===2) label = hadTdLastPoll ? 'Two-point conversion' : 'Safety';
  if(!label) label = 'Score';
  return `${label}, ${name}`;
}
const SCORE_CLIP = {'Touchdown':'s_td','Touchdown and extra point':'s_td_xp','Touchdown and two-point conversion':'s_td_2pt',
  'Field goal':'s_fg','Safety':'s_safety','Extra point':'s_xp','Two-point conversion':'s_2pt','Touchdown and field goal':'s_td_fg','Score':'s_score'};
const LEG_CLIP = {'now winning':'l_now_winning','now losing':'l_now_losing','now level':'l_now_level','won':'l_won','lost':'l_lost'};
const clipBuf = {};   // key -> decoded AudioBuffer
async function decodeClips(){
  if(!actx) return;
  for(const [k,uri] of Object.entries(VOICE_CLIPS)){
    if(clipBuf[k]) continue;
    try{ const bin = atob(uri.slice(uri.indexOf(',')+1)); const u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
          clipBuf[k] = await actx.decodeAudioData(u8.buffer); }
    catch(e){ console.warn('clip decode failed', k, e); }
  }
}
const lastVariant = {};
function resolveClip(k){
  if(VOICE_CLIPS[k]) return k;
  const re = new RegExp('^'+k+'_\\d+$');
  const opts = Object.keys(VOICE_CLIPS).filter(x=>re.test(x));
  if(!opts.length) return null;
  let pool = opts.length>1 ? opts.filter(x=>x!==lastVariant[k]) : opts;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  lastVariant[k] = pick; return pick;
}
function playWhistle(kind){   // original synthesized referee whistle: kind 'kick' = one blast, 'final' = three
  return new Promise(res=>{
    if(!actx || actx.state!=='running') return res();
    const blasts = kind==='final' ? [[0,0.35],[0.45,0.35],[0.9,0.9]] : [[0,0.7]];
    const t0 = actx.currentTime + 0.02;
    for(const [off,len] of blasts){
      const st=t0+off, en=st+len;
      const o=actx.createOscillator(); o.type='sine'; o.frequency.value=2850;
      const lfo=actx.createOscillator(); lfo.frequency.value=38;           // pea trill
      const lg=actx.createGain(); lg.gain.value=140; lfo.connect(lg); lg.connect(o.frequency);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.02);
      g.gain.setValueAtTime(0.22,en-0.05); g.gain.exponentialRampToValueAtTime(0.0001,en);
      // breathy noise layer
      const nb=actx.createBuffer(1, Math.ceil(actx.sampleRate*len), actx.sampleRate); const d=nb.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const n=actx.createBufferSource(); n.buffer=nb; const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2850; bp.Q.value=6;
      const ng=actx.createGain(); ng.gain.setValueAtTime(0.0001,st); ng.gain.exponentialRampToValueAtTime(0.12,st+0.02); ng.gain.exponentialRampToValueAtTime(0.0001,en);
      n.connect(bp); bp.connect(ng); ng.connect(actx.destination);
      o.connect(g); g.connect(actx.destination);
      o.start(st); lfo.start(st); n.start(st); o.stop(en+0.02); lfo.stop(en+0.02); n.stop(en+0.02);
    }
    const total = blasts[blasts.length-1][0]+blasts[blasts.length-1][1];
    setTimeout(res, total*1000+250);
  });
}
function playClip(k){
  return new Promise(res=>{
    const b = clipBuf[k];
    if(!b || !actx || actx.state!=='running') return res(false);
    console.log('[clip]', k, b.duration.toFixed(2)+'s');
    const src = actx.createBufferSource(); src.buffer=b;
    const g = actx.createGain(); g.gain.value=1.0; src.connect(g); g.connect(actx.destination);
    const to = setTimeout(()=>res(true), b.duration*1000+500);
    src.onended=()=>{ clearTimeout(to); res(true); };
    src.start();
  });
}
let soundOn = localStorage.getItem('st_sound')==='on';
let actx = null;
const alertQueue = [];
let alertBusy = false;
window.__alertLog = [];   // test hook: every alert that would be played
function unlockAudio(){
  try{
    if(!actx){ const AC = window.AudioContext||window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state==='suspended') actx.resume();
    if(actx) decodeClips();
    if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(''); u.volume=0; speechSynthesis.speak(u); }
  }catch(e){}
}
function updateSoundBtn(){
  const b=document.getElementById('sndbtn');
  b.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
  b.className = soundOn ? 'on' : 'off';
}
function toggleSound(){
  soundOn = !soundOn; localStorage.setItem('st_sound', soundOn?'on':'off');
  if(soundOn){ unlockAudio(); } else { alertQueue.length=0; if(window.speechSynthesis) speechSynthesis.cancel(); }
  updateSoundBtn();
}
function queueAlert(text, horn, clips, whistle){
  window.__alertLog.push({text, horn, clips, whistle, t:Date.now()});
  console.log('[alert]', whistle?('WHISTLE('+whistle+') +'):'', horn?'HORN +':'', text, JSON.stringify(clips||[]));
  if(!soundOn) return;
  if(alertQueue.length < 20) alertQueue.push({text, horn, clips, whistle});
  runQueue();
}
function playHorn(){
  return new Promise(res=>{
    if(!actx || actx.state!=='running') return res();
    const t0 = actx.currentTime, dur = 1.4;
    const out = actx.createGain(); out.gain.setValueAtTime(0.0001,t0);
    out.gain.exponentialRampToValueAtTime(0.35,t0+0.08); out.gain.setValueAtTime(0.35,t0+dur-0.3);
    out.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400; lp.Q.value=4;
    lp.connect(out); out.connect(actx.destination);
    for(const f of [174.6, 220, 261.6, 349.2]){       // stadium air-horn chord
      for(const det of [-6, 6]){
        const o = actx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=det;
        o.frequency.setValueAtTime(f*0.94,t0); o.frequency.linearRampToValueAtTime(f,t0+0.12);
        o.connect(lp); o.start(t0); o.stop(t0+dur+0.05);
      }
    }
    setTimeout(res, dur*1000+100);
  });
}
let gbVoice = null;
function pickVoice(){ if(!window.speechSynthesis) return; const v=speechSynthesis.getVoices();
  gbVoice = v.find(x=>/en-GB/i.test(x.lang)&&/Google|Natural|Online/i.test(x.name)) || v.find(x=>/en-GB/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  return new Promise(res=>{
    if(!window.speechSynthesis) return res();
    const u = new SpeechSynthesisUtterance(text);
    if(gbVoice){ u.voice=gbVoice; u.lang=gbVoice.lang; } else u.lang='en-GB';
    u.rate=1; u.volume=1;
    const done=()=>{ clearTimeout(to); res(); };
    const to=setTimeout(res, 8000);   // safety net if onend never fires
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  });
}
async function runQueue(){
  if(alertBusy) return; alertBusy=true;
  try{
    while(alertQueue.length && soundOn){
      const a = alertQueue.shift();
      if(a.whistle) await playWhistle(a.whistle);
      if(a.horn) await playHorn();
      const keys = (a.clips||[]).map(resolveClip).filter(Boolean);
      if(keys.length===(a.clips||[]).length && keys.length){ for(const k of keys){ await playClip(k); } }
      else if((a.clips||[]).length && window.speechSynthesis && speechSynthesis.getVoices().length) await speak(a.text);  // fallback only
      await new Promise(r=>setTimeout(r,300));
    }
  } finally { alertBusy=false; }
}
document.getElementById('sndbtn').addEventListener('click', toggleSound);
// any click/key unlocks audio (browsers block sound until a user gesture)
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ if(soundOn) unlockAudio(); }, {capture:true}));
updateSoundBtn();

function toggleFs(){
  unlockAudio();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
document.getElementById('fsbtn').addEventListener('click', toggleFs);
document.addEventListener('keydown', e=>{ if(e.key==='f'||e.key==='F') toggleFs(); if(e.key==='r'||e.key==='R') poll(); if(e.key==='s'||e.key==='S') toggleSound(); if(e.key==='a'||e.key==='A') toggleAccas(); });
window.addEventListener('resize', ()=>{});

loadCachedGames();
render();
const NOPOLL = new URLSearchParams(location.search).has('nopoll') || demoCount()>0;
if(!NOPOLL){
  poll();
  setInterval(poll, POLL_SECONDS*1000);
} else {
  setLiveStatus(true);
  const upd = document.getElementById('upd');
  if(upd && demoCount()) upd.textContent = 'demo · ' + demoCount() + ' live';
}
